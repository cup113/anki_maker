name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docker-compose.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docker-compose.yml'
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags for the API image
        id: api_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Derive tags for the web image
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fastapi
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.api_meta.outputs.tags }}
          labels: ${{ steps.api_meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # 同时载入本机，下面的冒烟测试要真的把镜像跑起来
          load: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # 2026-11-04 的 2.2.0 就是这样漏出去的：镜像能 build 能 push，
      # 但容器一起就 500 —— build/ 里按裸名 import 的包不在运行镜像里。
      - name: Smoke test the web image
        run: |
          set -uo pipefail
          image=$(jq -r '.tags[0]' <<< '${{ steps.web_meta.outputs.json }}')
          echo "starting $image"
          docker run -d --name web-smoke -p 3000:3000 -e ORIGIN=http://127.0.0.1:3000 "$image"
          trap 'docker rm -f web-smoke >/dev/null 2>&1' EXIT

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/ 2>/dev/null; then
              echo "GET / -> 200 after ${i}s"
              exit 0
            fi
            sleep 1
          done

          echo "::error::container is up but GET / never returned 200"
          docker logs web-smoke || true
          exit 1

      - name: Summary
        run: |
          echo "### ${{ github.event_name == 'pull_request' && 'Built (not pushed)' || 'Pushed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.api_meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.web_meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
